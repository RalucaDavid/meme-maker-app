name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meme-maker-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: meme-maker-app/package-lock.json
      - run: npm ci
      - name: Generate environment file
        env:
          IMGFLIP_USERNAME: ${{ secrets.IMGFLIP_USERNAME }}
          IMGFLIP_PASSWORD: ${{ secrets.IMGFLIP_PASSWORD }}
        run: |
          if [ -z "$IMGFLIP_USERNAME" ] || [ -z "$IMGFLIP_PASSWORD" ]; then
            echo "::error::Missing IMGFLIP_USERNAME or IMGFLIP_PASSWORD repository secret"
            exit 1
          fi
          node -e '
            const env = {
              production: true,
              baseUrl: "https://api.imgflip.com",
              imgflipUsername: process.env.IMGFLIP_USERNAME,
              imgflipPassword: process.env.IMGFLIP_PASSWORD
            };
            require("fs").writeFileSync(
              "src/environments/environment.ts",
              `export const environment = ${JSON.stringify(env, null, 4)};\n`
            );
          '
      - run: npx ng build --base-href /meme-maker-app/
      - run: cp dist/meme-maker-app/browser/index.html dist/meme-maker-app/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meme-maker-app/dist/meme-maker-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
