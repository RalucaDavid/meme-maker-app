<div class="editor-container">
  @if (memeState.currentMeme(); as currentMeme) {
    
    <app-meme-form 
      [currentMeme]="currentMeme"
      [isLoading]="isLoading()"
      (submitForm)="onFormSubmit($event)"
    />

    <app-meme-preview 
      [createdMeme]="createdMeme()"
      [isLoading]="isLoading()"
    />

  } @else {
    <mat-card appearance="outlined" class="warning-card">
      <mat-card-content class="warning-content">
        <mat-icon color="warn" class="warning-icon">warning</mat-icon>
        <h2>{{ 'noMemeTemplateSelected' | transloco }}</h2>
        <p>{{ 'chooseMemeTemplate' | transloco }}</p>
      </mat-card-content>
    </mat-card>
  }
</div>
